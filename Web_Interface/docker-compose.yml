services:
  db:
    image: postgres:16-alpine
    container_name: hvac-db
    environment:
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: hvac_dev
      POSTGRES_DB: hvac
    ports:
      - "5433:5432"
    volumes:
      - hvac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac -d hvac"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: HvacConfigurator.Api/Dockerfile
    container_name: hvac-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=hvac;Username=hvac;Password=hvac_dev
      Jwt__Secret: ${JWT_SECRET:-DEV_ONLY_CHANGE_IN_PRODUCTION_MIN_32_CHARACTERS_LONG}
      Cors__Origins__0: http://localhost:5180
    ports:
      - "5181:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  hvac_pgdata:
