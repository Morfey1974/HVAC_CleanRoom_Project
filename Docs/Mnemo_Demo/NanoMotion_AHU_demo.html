<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>HVAC CleanRoom — мнемосхема (демо по P&ID NanoMotion 26000017-HVAC-W)</title>
<style>
  :root {
    --bg: #0f172a; --panel: #111c33; --line: #1e2a44; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --ok: #22c55e; --warn: #f59e0b; --alarm: #ef4444;
    --metal1: #cbd5e1; --metal2: #94a3b8; --metal3: #64748b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  .lang button { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 4px 9px; cursor: pointer; border-radius: 4px; }
  .lang button.on { color: var(--text); border-color: var(--accent); }
  .bell { position: relative; cursor: pointer; font-size: 22px; user-select: none; }
  .bell .cnt { position: absolute; top: -6px; right: -10px; background: var(--alarm); color: #fff; border-radius: 9px; font-size: 11px; padding: 1px 6px; }
  .bell.active { color: var(--alarm); animation: blink 1s steps(2) infinite; }
  .wrap { display: flex; }
  .scene { flex: 1; padding: 8px; }
  svg { width: 100%; height: auto; display: block; }
  aside { width: 300px; background: var(--panel); border-left: 1px solid var(--line); padding: 14px; font-size: 13px; min-height: calc(100vh - 52px); }
  aside h3 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  aside label { display: flex; justify-content: space-between; margin: 6px 0 2px; }
  aside input[type=range] { width: 100%; }
  aside select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); padding: 4px; }
  .chk { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .note { color: var(--muted); font-size: 11px; margin-top: 12px; line-height: 1.4; }
  #alarms { position: fixed; top: 56px; right: 320px; width: 360px; background: var(--panel); border: 1px solid var(--alarm); border-radius: 6px; padding: 10px 12px; display: none; font-size: 13px; z-index: 5; }
  #alarms li { margin: 4px 0; }
  #card { position: fixed; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 12px; font-size: 13px; display: none; z-index: 6; min-width: 220px; }
  #card b { display: block; margin-bottom: 6px; color: var(--accent); }
  [dir=rtl] aside, [dir=rtl] #alarms, [dir=rtl] #card { text-align: right; }

  /* SVG */
  .lbl { fill: var(--text); font-size: 13px; }
  .lbl-s { fill: var(--muted); font-size: 11px; }
  .val { fill: #fff; font-size: 13px; font-weight: 600; }
  .tag { fill: #0b1222; stroke: #22d3ee; stroke-width: 1.5; }
  .tag-t { fill: #22d3ee; font-size: 10px; font-weight: 700; text-anchor: middle; }
  .flow { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 14 18; }
  .flow-supply { stroke: #e879f9; }
  .flow-fresh { stroke: #fb923c; }
  .flow-room { stroke: #4ade80; stroke-width: 4; }
  .flow-ac { stroke: #a3a36b; stroke-width: 4; }
  .duct { fill: #1e293b; stroke: #334155; stroke-width: 2; }
  .click { cursor: pointer; }
  .alarm-blink { animation: alarmfill 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes alarmfill { 50% { opacity: .15; } }
</style>
</head>
<body>
<header>

  <span class="sub">NanoMotion · 26000017-HVAC-W · rev 02</span>
  <span class="spacer"></span>

  <!-- ===== Крыша / этажи ===== -->

    <g stroke="#334155" stroke-width="2"><line x1="700" y1="238" x2="700" y2="272"/><line x1="712" y1="238" x2="712" y2="272"/><line x1="724" y1="238" x2="724" y2="272"/><line x1="736" y1="238" x2="736" y2="272"/></g>

<aside>

<script>

  en: {

    sim: "Value simulator", run: "Unit running", fanSp: "VSD, %", stages: "Heater stages",
    vrfMode: "VRF mode", vrfCap: "VRF capacity, %", outT: "Outdoor T, °C", dirt: "Filter loading, %",

    fTt: "Room TT sensor broken", fVrf: "VRF fault", activeAlarms: "Active alarms",
    off: "Off", cool: "Cooling", heat: "Heating", sp_: "setpoint",

    a_vrf: "VRF fault", a_roomT: "Room temperature out of ±2 °C band", noAlarms: "No active alarms",
    c: { vrf: "VRF outdoor unit", coil: "DX coil (VRF)", heater: "Electric heater 3×1.2 kW", fan: "Supply fan",
         vsd: "Variable speed drive (AO)", fs: "Flow switch FS (DI)", ts: "Overheat thermostat TS (DI)", f1: "Filter 12%", f2: "Filter 30%",
         f3: "Filter 95%", pi1: "PI — dP across 12/30% filters", pi2: "PI — dP across 95% filter", dpt: "DPT — supply duct pressure (AI)",
         tt1: "TT — supply air temperature (AI)", tt2: "TT — room temperature (AI)", room: "Extension room, ISO 7",
         relief: "Pressure relief damper", ac: "Existing AC unit (inverter)" },

  },

    fresh: "אוויר צח", room: "חדר הרחבה", acExisting: "מזגן קיים",
    sim: "סימולטור ערכים", run: "היחידה בפעולה", fanSp: "ממיר תדר, %", stages: "דרגות חימום",
    vrfMode: "מצב VRF", vrfCap: "הספק VRF, %", outT: "טמפ' חוץ, °C", dirt: "סתימת מסננים, %",
    sp: "נקודת קביעה טמפ' חדר, °C", faults: "הדמיית תקלות", fVsd: "תקלת ממיר תדר", fBelt: "אין זרימה (FS)",
    fTt: "חיישן TT חדר מנותק", fVrf: "תקלת VRF", activeAlarms: "התראות פעילות",
    off: "כבוי", cool: "קירור", heat: "חימום", sp_: "נקודת קביעה",
    note: "הדגמה לפי P&ID של NanoMotion 26000017-HVAC-W. הסכמה בנויה ממקטעים, כל חלק מקושר לערך. לחיצה על רכיב — כרטיס, פעמון — התראות פעילות.",
    a_flow: "אין זרימת אוויר (FS) כשהמפוח פועל", a_ts: "התחממות יתר של המחמם (TS) — הדרגות נותקו",
    a_vsd: "תקלת ממיר תדר מפוח", a_filt: "מסננים סתומים — נדרשת החלפה", a_tt: "חיישן TT חדר: נתק",
    a_vrf: "תקלת VRF", a_roomT: "טמפ' החדר מחוץ לתחום ±2 °C", noAlarms: "אין התראות פעילות",
    c: { vrf: "VRF — יחידה חיצונית", coil: "סליל DX (VRF)", heater: "מחמם חשמלי 3×1.2 קו\"ט", fan: "מפוח אספקה",
         vsd: "ממיר תדר (AO)", fs: "מפסק זרימה FS (DI)", ts: "תרמוסטט התחממות TS (DI)", f1: "מסנן 12%", f2: "מסנן 30%",
         f3: "מסנן 95%", pi1: "PI — הפרש לחצים מסננים 12/30%", pi2: "PI — הפרש לחצים מסנן 95%", dpt: "DPT — לחץ בתעלת אספקה (AI)",
         tt1: "TT — טמפ' אוויר אספקה (AI)", tt2: "TT — טמפ' חדר (AI)", room: "חדר הרחבה, ISO 7",
         relief: "מדף שחרור לחץ", ac: "מזגן קיים (אינוורטר)" },
    state: "מצב", on: "פועל", stop: "עצור", alarm: "תקלה", value: "ערך", ch: "ערוץ"
  }
};
let lang = "ru";
const $ = id => document.getElementById(id);

function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => { const k = e.dataset.t; if (t[k]) e.textContent = t[k]; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  const opts = $("vrfMode").options; opts[0].text = t.off; opts[1].text = t.cool; opts[2].text = t.heat;
  $("bell").title = t.activeAlarms;
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; applyLang(); render(); });

/* FFU — 6 шт. по 440 cfm */
const ffuG = $("ffus"), rfG = $("roomFlows"), ffuFans = [];
for (let i = 0; i < 6; i++) {
  const x = 440 + i * 110, ns = "http://www.w3.org/2000/svg";
  const g = document.createElementNS(ns, "g");
  g.setAttribute("class", "click"); g.dataset.card = "ffu" + i;
  g.innerHTML = `<rect x="${x - 40}" y="488" width="80" height="20" fill="#14532d" stroke="#4ade80"/>
    <circle cx="${x}" cy="498" r="8" fill="#0b1222" stroke="#4ade80"/>
    <g transform="translate(${x} 498)"><path d="M0 -7 L2 0 L0 7 L-2 0 z M-7 0 L0 2 L7 0 L0 -2 z" fill="#4ade80"/></g>
    <text x="${x}" y="524" text-anchor="middle" class="lbl-s" style="fill:#60a5fa">440 cfm</text>`;
  ffuG.appendChild(g); ffuFans.push(g.querySelector("g"));
  const p = document.createElementNS(ns, "path");
  p.setAttribute("class", "flow flow-room"); p.setAttribute("d", `M${x} 530 V585`);
  rfG.appendChild(p);
}

/* состояние процесса */
const S = { roomT: 20.5, supplyT: 18, fanRpmPhase: 0, flowPhase: 0, tsTrip: false };
function ctl() {
  return {
    run: $("run").checked, fan: +$("fanSp").value, stages: +$("stages").value, vrfMode: $("vrfMode").value,
    vrfCap: +$("vrfCap").value, outT: +$("outT").value, dirt: +$("dirt").value, sp: +$("sp").value,
    fVsd: $("fVsd").checked, fBelt: $("fBelt").checked, fTt: $("fTt").checked, fVrf: $("fVrf").checked
  };
}
let alarms = [];

function step() {
  const c = ctl();
  const fanOn = c.run && !c.fVsd && c.fan > 0;
  const flowPct = fanOn && !c.fBelt ? c.fan * (1 - c.dirt / 250) : 0;
  const flowOk = flowPct > 15;
  if (!c.run) S.tsTrip = false;
  const stagesOn = c.run && flowOk && !S.tsTrip ? c.stages : 0;
  if (c.run && c.stages > 0 && fanOn && !flowOk && c.fBelt) S.tsTrip = true;
  const vrfOn = c.run && c.vrfMode !== "off" && !c.fVrf && flowOk;
  const vrfDelta = vrfOn ? (c.vrfMode === "cool" ? -12 : 12) * c.vrfCap / 100 : 0;
  const k = flowOk ? 600 / Math.max(150, 600 * flowPct / 100) : 0;
  const targetSupply = flowOk ? c.outT + vrfDelta + stagesOn * 3.2 * Math.min(k, 3) : S.roomT;
  S.supplyT += (targetSupply - S.supplyT) * 0.15;
  const roomTarget = flowOk ? 0.55 * S.supplyT + 0.45 * 22 : 22 + (c.outT - 22) * 0.1;
  S.roomT += (roomTarget - S.roomT) * 0.03;
  const cfm = Math.round(600 * flowPct / 100);
  const dpFilt1 = Math.round((40 + c.dirt * 2.2) * (flowPct / 100) ** 2);
  const dpFilt2 = Math.round((120 + c.dirt * 3.5) * (flowPct / 100) ** 2);
  const ductP = Math.round(250 * (flowPct / 100) ** 2);

  alarms = [];
  if (c.fVsd && c.run) alarms.push({ k: "a_vsd", el: "vsd" });
  if (fanOn && !flowOk) alarms.push({ k: "a_flow", el: "fs" });
  if (S.tsTrip) alarms.push({ k: "a_ts", el: "ts" });
  if (c.dirt >= 80) alarms.push({ k: "a_filt", el: "filters" });
  if (c.fTt) alarms.push({ k: "a_tt", el: "tt2" });
  if (c.fVrf && c.run && c.vrfMode !== "off") alarms.push({ k: "a_vrf", el: "vrf" });
  if (!c.fTt && c.run && Math.abs(S.roomT - c.sp) > 2) alarms.push({ k: "a_roomT", el: "room" });

  Object.assign(S, { c, fanOn, flowPct, flowOk, stagesOn, vrfOn, cfm, dpFilt1, dpFilt2, ductP });
  render();
}

function heatColor(on) { return on ? "#ef4444" : "#64748b"; }
function setBlink(id, on) { const e = $(id); if (e) e.classList.toggle("alarm-blink", on); }

function render() {
  if (!S.c) return;
  const t = T[lang], c = S.c;
  $("fanSpV").textContent = c.fan + "%"; $("stagesV").textContent = c.stages;
  $("vrfCapV").textContent = c.vrfCap + "%"; $("outTV").textContent = c.outT + "°"; $("dirtV").textContent = c.dirt + "%"; $("spV").textContent = c.sp + "°";

  ["h1", "h2", "h3"].forEach((h, i) => $(h).setAttribute("stroke", heatColor(i < S.stagesOn)));
  const coil = S.vrfOn ? (c.vrfMode === "cool" ? `rgba(59,130,246,${0.35 + c.vrfCap / 160})` : `rgba(239,68,68,${0.35 + c.vrfCap / 160})`) : "#94a3b8";
  $("coilBody").setAttribute("fill", coil);
  $("vrfState").setAttribute("fill", c.fVrf && c.vrfMode !== "off" && c.run ? "#ef4444" : S.vrfOn ? "#22c55e" : "#475569");
  ["f1dirt", "f2dirt", "f3dirt"].forEach((f, i) => { const h = 120 * c.dirt / 100 * (i === 2 ? 0.7 : 1); $(f).setAttribute("y", 315 - h); $(f).setAttribute("height", h); });
  $("pi1n").setAttribute("transform", `rotate(${-90 + Math.min(180, S.dpFilt1 / 1.6)} 202 100)`);
  $("pi2n").setAttribute("transform", `rotate(${-90 + Math.min(180, S.dpFilt2 / 2.4)} 877 100)`);
  $("pi1v").textContent = S.dpFilt1 + " Pa"; $("pi2v").textContent = S.dpFilt2 + " Pa";
  $("vsdV").textContent = c.fVsd ? "FAULT" : (S.fanOn ? (c.fan * 0.5).toFixed(1) + " Hz" : "0 Hz");
  $("vsdBody").setAttribute("stroke", c.fVsd && c.run ? "#ef4444" : "#22d3ee");
  $("dptV").textContent = S.ductP + " Pa"; $("tt1V").textContent = S.supplyT.toFixed(1) + " °C";
  $("cfmV").textContent = S.cfm + " cfm";
  $("freshV").textContent = c.outT + " °C";
  $("roomT").textContent = c.fTt ? "— — °C" : S.roomT.toFixed(1) + " °C";
  $("roomSp").textContent = `${t.sp_} ${c.sp} °C`;

  const fOp = S.flowOk ? 1 : 0.12;
  ["flowFresh", "flowSupply", "flowRelief"].forEach(id => $(id).style.opacity = fOp);
  $("flowAhu").style.opacity = S.flowOk ? 0.45 : 0.08;
  rfG.querySelectorAll("path").forEach(p => p.style.opacity = c.run ? 1 : 0.12);
  $("reliefBlades").setAttribute("transform", S.flowOk ? "rotate(-25 1150 725)" : "");

  const act = new Set(alarms.map(a => a.el));
  setBlink("vsdBody", act.has("vsd")); setBlink("fsTag", act.has("fs")); setBlink("tsTag", act.has("ts"));
  setBlink("tt2Tag", act.has("tt2")); setBlink("roomBody", act.has("room")); setBlink("vrfState", act.has("vrf"));
  ["f1", "f2", "f3"].forEach(f => setBlink(f, act.has("filters")));
  $("bellCnt").textContent = alarms.length; $("bell").classList.toggle("active", alarms.length > 0);
  $("alarmList").innerHTML = alarms.length ? alarms.map(a => `<li style="color:#fca5a5">● ${t[a.k]}</li>`).join("") : `<li>${t.noAlarms}</li>`;
}

/* анимация: вентиляторы и поток */
let last = performance.now(), fanA = 0, vrfA = 0, ffuA = 0, acA = 0, dash = 0;
function anim(now) {
  const dt = (now - last) / 1000; last = now;
  if (S.c) {
    fanA += dt * (S.fanOn ? S.c.fan * 7 : 0);
    vrfA += dt * (S.vrfOn ? 200 : 0);
    ffuA += dt * (S.c.run ? 500 : 0);
    acA += dt * 250;
    dash -= dt * (S.flowOk ? 20 + S.flowPct * 0.8 : 0);
    $("fanBlades").setAttribute("transform", `translate(620 255) rotate(${fanA})`);
    $("vrfFan").setAttribute("transform", `translate(345 50) rotate(${vrfA})`);
    $("acFan").setAttribute("transform", `translate(1250 530) rotate(${acA})`);
    ffuFans.forEach((f, i) => f.setAttribute("transform", `translate(${440 + i * 110} 498) rotate(${ffuA})`));
    document.querySelectorAll(".flow").forEach(p => p.style.strokeDashoffset = dash);
    rfG.querySelectorAll("path").forEach(p => p.style.strokeDashoffset = S.c.run ? dash * 0.8 - now / 40 : 0);
    $("flowAc").style.strokeDashoffset = -now / 30;
  }
  requestAnimationFrame(anim);
}

/* карточки элементов */
const chan = { vrf: "DO1 / DI5", coil: "—", heater: "RL1..RL3", fan: "DO2", vsd: "AO1 / DI3", fs: "DI1", ts: "DI2",
  f1: "—", f2: "—", f3: "—", pi1: "local", pi2: "local", dpt: "AI2", tt1: "AI1", tt2: "AI3", room: "—", relief: "—", ac: "—" };
function cardText(key) {
  const t = T[lang], c = S.c;
  if (key.startsWith("ffu")) return { h: `FFU ${+key.slice(3) + 1}`, rows: [[t.state, c.run ? t.on : t.stop], [t.value, "440 cfm"]] };
  const val = {
    vrf: c.vrfMode === "off" ? t.off : t[c.vrfMode] + " " + c.vrfCap + "%", heater: S.stagesOn + " / 3",
    fan: S.fanOn ? c.fan + "%" : t.stop, vsd: c.fVsd ? t.alarm : (S.fanOn ? (c.fan * 0.5).toFixed(1) + " Hz" : "0 Hz"),
    fs: S.flowOk ? "OK" : "—", ts: S.tsTrip ? t.alarm : "OK", f1: S.dpFilt1 + " Pa", f2: S.dpFilt1 + " Pa", f3: S.dpFilt2 + " Pa",
    pi1: S.dpFilt1 + " Pa", pi2: S.dpFilt2 + " Pa", dpt: S.ductP + " Pa", tt1: S.supplyT.toFixed(1) + " °C",
    tt2: c.fTt ? t.alarm : S.roomT.toFixed(1) + " °C", room: S.roomT.toFixed(1) + " °C · " + S.cfm + " cfm",
    coil: S.vrfOn ? t[c.vrfMode] : t.off, relief: S.flowOk ? "open" : "closed", ac: t.on
  }[key];
  return { h: t.c[key], rows: [[t.value, val], [t.ch, chan[key]]] };
}
document.addEventListener("click", e => {
  const card = $("card");
  if (e.target.closest("#bell")) { const a = $("alarms"); a.style.display = a.style.display === "block" ? "none" : "block"; card.style.display = "none"; return; }
  const g = e.target.closest("[data-card]");
  if (!g) { card.style.display = "none"; return; }
  const d = cardText(g.dataset.card);
  card.innerHTML = `<b>${d.h}</b>` + d.rows.map(r => `<div>${r[0]}: <span style="color:#fff">${r[1]}</span></div>`).join("");
  card.style.left = Math.min(e.clientX + 12, innerWidth - 260) + "px"; card.style.top = (e.clientY + 12) + "px"; card.style.display = "block";
});

applyLang();
step();
setInterval(step, 500);
requestAnimationFrame(anim);
</script>
